name: meta_dat
description: A Flutter plugin wrapping the Meta Wearables Device Access Toolkit (DAT) iOS SDK for building hands-free wearable experiences with Meta AI glasses.
version: 0.1.0
homepage: https://github.com/chrisstayte/dart-meta-dat
repository: https://github.com/chrisstayte/dart-meta-dat
issue_tracker: https://github.com/chrisstayte/dart-meta-dat/issues

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: MetaDatPlugin
