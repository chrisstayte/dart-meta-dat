group = "com.chrisstayte.meta_dat"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.chrisstayte.meta_dat"
    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 31
    }
}

dependencies {
    implementation("org.jetbrains.kotlin:kotlin-stdlib:1.9.0")

    // Meta Wearables DAT Android SDK dependencies are provided by the host app.
    // The host app must add the following to their build.gradle:
    //   implementation("com.meta.wearable:mwdat-core:<version>")
    //   implementation("com.meta.wearable:mwdat-camera:<version>")
    compileOnly("com.meta.wearable:mwdat-core:0.5.0")
    compileOnly("com.meta.wearable:mwdat-camera:0.5.0")
}
